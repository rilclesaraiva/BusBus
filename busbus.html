     Texto completo: https://github.com/rilclesaraiva/BusBus/blob/main/LICENSE -->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BusBus — Belém em tempo real</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
:root{
--bg:#F6F2E6; --ink:#17241C; --ink-soft:#52604F;
--primary:#146B49; --primary-ink:#ffffff; --primary-soft:#C9EAD9;
--river:#2B5F8A; --river-soft:#D9E7F1;
--soon:#E8793A; --soon-soft:#FBE3CF;
--now:#D64545; --now-soft:#F8D9D4;
--card:#FFFFFF; --line:#E6DFCD;
--skeleton-hl:#f0ebdb;
--radius-lg:28px; --radius-md:18px; --radius-sm:12px;
}
/* tema "sistema": quando o SO está em modo escuro e o usuário não forçou um tema manualmente */
@media (prefers-color-scheme: dark){
html:not([data-theme]){
--bg:#1E1F22; --ink:#E8EAED; --ink-soft:#9AA0A6;
--primary:#22B37C; --primary-ink:#06160F; --primary-soft:#133A29;
--river:#7FB2E8; --river-soft:#182C3E;
--soon:#F0A268; --soon-soft:#3B2515;
--now:#EC7575; --now-soft:#3B1E1E;
--card:#28292C; --line:#3B3C3F;
--skeleton-hl:#38393c;
}
}
/* escuro — forçado nos Ajustes, independente do SO */
html[data-theme="dark"]{
--bg:#1E1F22; --ink:#E8EAED; --ink-soft:#9AA0A6;
--primary:#22B37C; --primary-ink:#06160F; --primary-soft:#133A29;
--river:#7FB2E8; --river-soft:#182C3E;
--soon:#F0A268; --soon-soft:#3B2515;
--now:#EC7575; --now-soft:#3B1E1E;
--card:#28292C; --line:#3B3C3F;
--skeleton-hl:#38393c;
}
/* claro — forçado nos Ajustes, mesmo se o SO estiver em modo escuro */
html[data-theme="light"]{
--bg:#F6F2E6; --ink:#17241C; --ink-soft:#52604F;
--primary:#146B49; --primary-ink:#ffffff; --primary-soft:#C9EAD9;
--river:#2B5F8A; --river-soft:#D9E7F1;
--soon:#E8793A; --soon-soft:#FBE3CF;
--now:#D64545; --now-soft:#F8D9D4;
--card:#FFFFFF; --line:#E6DFCD;
--skeleton-hl:#f0ebdb;
}
/* preto AMOLED — fundo 100% preto pra economizar bateria em tela OLED */
html[data-theme="amoled"]{
--bg:#000000; --ink:#F2F2F2; --ink-soft:#8A8A8A;
--primary:#1B8F63; --primary-ink:#F2F2F2; --primary-soft:#102D20;
--river:#7FB2E8; --river-soft:#101E2B;
--soon:#F0A268; --soon-soft:#2A1A0E;
--now:#EC7575; --now-soft:#2A1414;
--card:#0B0B0B; --line:#242424;
--skeleton-hl:#1a1a1a;
}
html{ background:var(--bg); scrollbar-width:none; -ms-overflow-style:none; }
html[data-theme], html:not([data-theme]) { transition: background-color .15s ease; }
*{box-sizing:border-box;}
/* esconde a barra de rolagem nativa (cinza) do navegador/WebView em toda a UI —
uma barra de scroll visível lembra site, não app */
html::-webkit-scrollbar, body::-webkit-scrollbar, *::-webkit-scrollbar{ display:none; width:0; height:0; }
html, body, *{ scrollbar-width:none; -ms-overflow-style:none; }
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;
-webkit-font-smoothing:antialiased;}
h1,h2,.num{font-family:'Fredoka',sans-serif;}
#app{max-width:460px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;
padding-bottom:100px;position:relative;}
header{padding:20px 20px 12px;display:flex;align-items:center;gap:12px;}
.backBtn{background:var(--card);border:1px solid var(--line);border-radius:12px;width:38px;height:38px;
display:flex;align-items:center;justify-content:center;color:var(--primary);cursor:pointer;flex:none;
visibility:hidden;}
.backBtn.show{visibility:visible;}
.backBtn:active{transform:scale(.95);}
.bellBtn{background:var(--card);border:1px solid var(--line);border-radius:12px;width:38px;height:38px;
display:flex;align-items:center;justify-content:center;color:var(--primary);cursor:pointer;flex:none;
margin-left:auto;position:relative;visibility:hidden;}
.bellBtn.show{visibility:visible;}
.bellBtn:active{transform:scale(.95);}
.bellDot{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--now);
border:1.5px solid var(--card);display:none;}
.bellDot.show{display:block;}
header h1{margin:0 0 2px;font-size:28px;font-weight:700;color:var(--primary);letter-spacing:-0.5px;}
header p{margin:0;color:var(--ink-soft);font-size:13px;}
section{padding:0 20px;}
.sectionTitle{font-size:13px;font-weight:600;color:var(--ink-soft);margin:10px 0 10px;}
.mainMapContainer{margin:0 20px 12px;height:250px;border-radius:var(--radius-lg);
border:1px solid var(--line);overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.06);position:relative;}
#mapContainer{width:100%;height:100%;background:#e5e3df;}
.mapBtnStack{position:absolute;bottom:12px;right:12px;z-index:1000;display:flex;flex-direction:column;gap:8px;}
.weatherChip{position:absolute;top:12px;left:12px;z-index:1000;background:var(--card);border:1px solid var(--line);
border-radius:999px;padding:7px 13px 7px 10px;align-items:center;gap:6px;font-size:12.5px;font-weight:600;
color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.18);cursor:pointer;}
.weatherChip .wIcon{font-size:15px;line-height:1;}
.weatherChip .wFeels{opacity:.65;font-weight:500;}
.weatherDetailCard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-md);
padding:14px 16px;margin:0 20px 12px;font-size:13px;color:var(--ink-soft);line-height:1.6;}
.weatherDetailCard b{color:var(--ink);}
.mapBtn{background:var(--card);border:1px solid var(--line);border-radius:50%;width:36px;height:36px;
display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,0.2);color:var(--primary);}
.mapBtn:active{transform:scale(0.92);}
.mapBtn#compassBtn svg{transition:transform .15s linear;}
.mapBtn#compassBtn.off{color:var(--ink-soft);}
.mapBtn.followActive{background:var(--primary);color:#fff;border-color:var(--primary);}
.stopCard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-md);
padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:.15s;
display:flex;align-items:center;gap:14px;}
.stopCard:active{transform:scale(.98);}
.stopIcon{flex:none;width:38px;height:38px;border-radius:12px;background:var(--river-soft);
display:flex;align-items:center;justify-content:center;color:var(--river);}
.stopInfo{flex:1;min-width:0;}
.stopInfo .name{font-weight:600;font-size:14px;}
.stopInfo .meta{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.lineRow{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-md);
padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:14px;
cursor:pointer;}
.badge{flex:none;min-width:52px;height:36px;border-radius:12px;background:var(--primary-soft);
color:var(--primary);display:flex;align-items:center;justify-content:center;
font-family:'Fredoka',sans-serif;font-weight:600;font-size:14px;padding:0 8px;}
.lineRow .dest{flex:1;font-size:13.5px;font-weight:500;line-height:1.3;}
.plateTag{display:inline-block;margin-top:3px;font-size:11px;font-weight:600;color:var(--ink-soft);
background:var(--bg);padding:2px 6px;border-radius:6px;border:1px solid var(--line);}
.eta{flex:none;text-align:right;font-family:'Fredoka',sans-serif;font-weight:600;font-size:15px;}
.eta.soon{color:var(--soon);} .eta.now{color:var(--now);}
.eta small{display:block;font-family:'Inter';font-weight:500;font-size:10.5px;color:var(--ink-soft);}
.empty{text-align:center;padding:30px 20px;color:var(--ink-soft);font-size:13.5px;}
.status{margin:0 20px 10px;font-size:12.5px;color:var(--ink-soft);display:flex;align-items:center;gap:6px;}
.status.err{color:var(--now);}
.spinner{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--primary);
border-radius:50%;animation:spin .7s linear infinite;flex:none;}
@keyframes spin{to{transform:rotate(360deg)}}
.bottomNav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);max-width:420px;
width:calc(100% - 32px);background:var(--primary);border-radius:999px;padding:8px 12px;
display:flex;align-items:center;justify-content:space-around;
box-shadow:0 10px 30px rgba(30,107,78,.4);z-index:1000;transition:.2s;}
.bottomNav.hidden{display:none;}
.skeletonCard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-md);
padding:16px 18px;margin-bottom:10px;display:flex;align-items:center;gap:14px;}
.skeletonIcon, .skeletonLine{border-radius:8px;background:linear-gradient(90deg,var(--line) 25%,var(--skeleton-hl) 50%,var(--line) 75%);
background-size:200% 100%;animation:shimmer 1.3s infinite;}
.skeletonIcon{flex:none;width:38px;height:38px;border-radius:12px;}
.skeletonLine{height:12px;border-radius:6px;}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.favStar{flex:none;background:none;border:none;cursor:pointer;color:var(--soon);padding:4px;}
.favStar:active{transform:scale(.88);}
.infoBtn{flex:none;width:30px;height:30px;border-radius:50%;background:var(--river-soft);
color:var(--river);border:none;display:flex;align-items:center;justify-content:center;
cursor:pointer;font-family:'Fredoka';font-weight:700;font-size:13px;}
.infoBtn:active{transform:scale(.9);}
.sectionTitleRow{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px;}
.sectionTitleRow .sectionTitle{margin:0;}
.modalOverlay{position:fixed;inset:0;background:rgba(23,36,28,.55);z-index:3000;
display:flex;align-items:flex-end;justify-content:center;}
.modalCard{background:var(--card);width:100%;max-width:460px;border-radius:24px 24px 0 0;
max-height:78vh;overflow-y:auto;padding:20px;animation:slideUp .2s ease-out;}
@keyframes slideUp{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
.modalHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.modalHead h3{margin:0;font-size:17px;}
.modalClose{width:30px;height:30px;border-radius:50%;border:none;background:var(--bg);
color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.streetItem{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);
font-size:14px;}
.streetItem:last-child{border-bottom:none;}
.streetItem .n{flex:none;width:22px;height:22px;border-radius:50%;background:var(--primary-soft);
color:var(--primary);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;
font-family:'Fredoka';}
.aboutSection{padding:12px 0;border-bottom:1px solid var(--line);}
.aboutTitle{font-family:'Fredoka';font-weight:600;font-size:14.5px;color:var(--primary);margin-bottom:6px;}
.aboutText{font-size:13px;color:var(--ink-soft);line-height:1.6;}
.pixQrImg{display:block;width:180px;height:180px;margin:4px auto 10px;border-radius:12px;border:1px solid var(--line);}
.pixHint{text-align:center;margin-bottom:14px;}
.pixCodeBox{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:11px;font-family:monospace;color:var(--ink-soft);word-break:break-all;margin-bottom:12px;}
.pixCopyBtn{width:100%;background:var(--primary);color:#fff;border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:0;}
.supportOptTitle{font-family:'Fredoka';font-weight:600;font-size:13px;color:var(--ink);margin-bottom:8px;}
.supportDivider{text-align:center;font-size:12px;color:var(--ink-soft);margin:18px 0;position:relative;}
.pixCopyBtn:active{opacity:.85;}
.cardPayBtn{background:#2B2F38;}
.toggleRow{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:13.5px;font-weight:600;}
.toggleSwitch{position:relative;display:inline-block;width:42px;height:24px;flex:none;}
.toggleSwitch input{opacity:0;width:0;height:0;position:absolute;}
.toggleSlider{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:.18s;}
.toggleSlider:before{content:"";position:absolute;height:18px;width:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.18s;box-shadow:0 1px 2px rgba(0,0,0,.3);}
.toggleSwitch input:checked + .toggleSlider{background:var(--primary);}
.toggleSwitch input:checked + .toggleSlider:before{transform:translateX(18px);}
.licenseItem{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);}
.licenseItem:last-child{border-bottom:none;}
.licenseLogo{width:26px;height:26px;border-radius:6px;flex:none;margin-top:2px;object-fit:contain;background:#fff;padding:3px;}
.licenseTitle{font-family:'Fredoka';font-weight:600;font-size:14px;color:var(--ink);margin-bottom:3px;}
.licenseDesc{font-size:12.5px;color:var(--ink-soft);line-height:1.5;margin-bottom:4px;}
.licenseLink{font-size:12px;color:var(--primary);word-break:break-all;text-decoration:none;}
.messageCard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-md);
padding:16px;margin-bottom:12px;}
.messageTitle{font-family:'Fredoka';font-weight:600;font-size:14.5px;color:var(--ink);margin-bottom:6px;}
.messageBody{font-size:13px;color:var(--ink-soft);line-height:1.6;}
.routeInputCard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-md);
padding:6px 14px;margin-bottom:12px;}
.routeInputRow{display:flex;align-items:center;gap:10px;padding:11px 0;position:relative;}
.routeInputRow:not(:last-child){border-bottom:1px dashed var(--line);}
.routeInputRow .dot{flex:none;width:11px;height:11px;border-radius:50%;}
.routeInputRow .dot.o{background:var(--primary);}
.routeInputRow .dot.d{background:var(--now);}
.routeInputRow input{flex:1;border:none;outline:none;background:none;font:inherit;font-size:14.5px;color:var(--ink);min-width:0;}
.routeInputRow input::placeholder{color:#9aa39a;}
.routeInputRow button.useLoc{flex:none;background:none;border:none;color:var(--primary);cursor:pointer;padding:4px;}
.geoSuggest{position:absolute;top:100%;left:0;right:0;background:var(--card);border:1px solid var(--line);
border-radius:var(--radius-sm);box-shadow:0 6px 18px rgba(0,0,0,.12);z-index:50;max-height:220px;overflow-y:auto;}
.geoSuggest div{padding:11px 14px;font-size:13.5px;cursor:pointer;border-bottom:1px solid var(--line);}
.geoSuggest div:last-child{border-bottom:none;}
.geoSuggest div:active{background:var(--bg);}
.planBtn{width:100%;background:var(--primary);color:#fff;border:none;border-radius:999px;
padding:15px;font-family:'Fredoka';font-weight:600;font-size:14.5px;cursor:pointer;margin-bottom:18px;}
.planBtn:disabled{opacity:.5;}
.tripCard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-md);
padding:16px;margin-bottom:12px;}
.tripBadgeRow{display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:11px;
font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;}
.tripBadgeRow.direct{color:var(--primary);}
.legWalk{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:13px;color:var(--ink-soft);}
.legWalk svg{flex:none;opacity:.7;}
.legBus{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--bg);
border-radius:var(--radius-sm);margin:4px 0;cursor:pointer;}
.legBus:active{transform:scale(.98);}
.legBus .badge{min-width:46px;height:32px;font-size:12.5px;}
.legBus .d{flex:1;font-size:12.5px;font-weight:500;line-height:1.3;}
.legConnector{width:2px;height:14px;background:var(--line);margin-left:15px;}
.diagCard{margin-top:4px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);
padding:12px 14px;}
.diagCard summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--river);}
.diagLog{margin-top:10px;font-size:11.5px;color:var(--ink-soft);line-height:1.6;
max-height:260px;overflow-y:auto;font-family:'JetBrains Mono',monospace;}
.diagLog div{padding:3px 0;border-bottom:1px dashed var(--line);}
.diagLog div:last-child{border-bottom:none;}
.navBtn{background:none;border:none;color:rgba(255,255,255,.65);display:flex;flex-direction:column;
align-items:center;gap:2px;font-family:'Fredoka',sans-serif;font-size:11px;font-weight:500;
cursor:pointer;padding:8px 16px;border-radius:999px;transition:.2s;}
.navBtn.active,.navBtn:active{color:#ffffff;background:rgba(255,255,255,.15);}
.navBtn svg{width:20px;height:20px;}
.searchBox{margin:0 20px 12px;display:flex;align-items:center;gap:10px;background:var(--card);
border:1px solid var(--line);border-radius:16px;padding:12px 16px;}
.searchBox input{border:none;outline:none;background:none;width:100%;font-size:14px;color:var(--ink);}
.searchClearBtn{flex:none;background:var(--bg);border:none;border-radius:50%;width:22px;height:22px;
display:flex;align-items:center;justify-content:center;color:var(--ink-soft);cursor:pointer;padding:0;}
.searchClearBtn:active{transform:scale(.88);}
.historyRow{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px;}
.historyRow .sectionTitle{margin:0;}
.clearHistoryBtn{background:none;border:none;color:var(--river);font-size:12px;font-weight:600;
cursor:pointer;padding:4px;}
.historyItem{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
border-radius:var(--radius-md);padding:12px 14px;margin-bottom:8px;cursor:pointer;}
.historyItem:active{transform:scale(.98);}
.historyItem svg{flex:none;color:var(--ink-soft);}
.historyItem span{flex:1;font-size:13.5px;}
.searchTabs{display:flex;gap:8px;margin:0 20px 16px;}
.tabBtn{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);
color:var(--ink-soft);font-family:'Fredoka',sans-serif;font-weight:600;font-size:13px;
cursor:pointer;text-align:center;transition:.15s;}
.tabBtn.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.configCard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-md);
padding:18px;margin-bottom:14px;}
.configCard h3{margin:0 0 8px;font-size:15px;color:var(--primary);}
.settingsTitle{font-family:'Fredoka';font-size:30px;font-weight:700;color:var(--ink);
letter-spacing:-0.5px;margin:4px 0 18px;}
.sectionLabel{font-size:11.5px;font-weight:700;color:var(--ink-soft);letter-spacing:.06em;
text-transform:uppercase;margin:0 0 8px 2px;}
.settingsGroup{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-md);
margin-bottom:22px;overflow:hidden;}
.settingsRow{display:flex;align-items:flex-start;gap:14px;padding:16px 16px;}
.settingsRow:not(:last-child){border-bottom:1px solid var(--line);}
.settingsRow.link{cursor:pointer;}
.settingsRow.link:active{background:var(--bg);}
.settingsIcon{flex:none;width:38px;height:38px;border-radius:12px;background:var(--primary-soft);
color:var(--primary);display:flex;align-items:center;justify-content:center;}
.settingsRow .rowBody{flex:1;min-width:0;}
.settingsRow .rowTitle{font-size:14.5px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:8px;}
.settingsRow .rowDesc{font-size:12.5px;color:var(--ink-soft);margin-top:3px;line-height:1.5;}
.settingsRow .rowControl{margin-top:12px;}
.settingsRow .chev{flex:none;align-self:center;color:var(--ink-soft);opacity:.5;}
.comingSoonBadge{flex:none;font-size:10.5px;font-weight:700;color:var(--soon);background:var(--soon-soft);
padding:3px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em;}
.settingsFooter{text-align:center;color:var(--ink-soft);font-size:12px;padding:10px 20px 30px;line-height:1.7;}
.settingsFooter b{color:var(--primary);font-family:'Fredoka';}
.footerAuthorLink{text-decoration:none;}
.footerAuthorLink:active b{opacity:.7;}
.radioGroup{display:flex;flex-wrap:wrap;gap:8px;}
.radioBtn{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);
font-size:12.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;}
.radioBtn.selected{background:var(--primary);color:#fff;border-color:var(--primary);}
.terminalBox{margin:16px 20px;background:#0f172a;border-radius:var(--radius-md);
padding:14px;color:#38bdf8;font-family:'JetBrains Mono',monospace;font-size:11px;
box-shadow:0 4px 12px rgba(0,0,0,.15);border:1px solid #1e293b;}
.terminalHeader{display:flex;justify-content:space-between;align-items:center;
margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid #1e293b;color:#94a3b8;}
.terminalTitle{font-weight:600;display:flex;align-items:center;gap:6px;}
.terminalTitle::before{content:"$";color:#f43f5e;font-weight:bold;}
.copyBtn{background:#1e293b;color:#f1f5f9;border:1px solid #334155;border-radius:6px;
padding:4px 8px;font-size:10px;cursor:pointer;font-family:inherit;}
.copyBtn:active{background:#334155;}

<!-- Leaflet JS + plugin de rotação (gesto de dois dedos + setBearing programático) -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-rotate@0.2.8/dist/leaflet-rotate-src.js"></script>
<script>
const CITY = "1224";
const BASE = "https://busbus.saraivarilcle.workers.dev";
let state = {
view: "stops",
coord: null,
locSource: "Buscando...",
locTimestamp: null,
radarRadius: 600,
rotationEnabled: false,
theme: "system",
mapTheme: "auto", // "auto" segue o tema do app; "light"/"dark" força o visual do mapa independente do tema do app
favoriteStops: [],
lastMapView: null,
lastMapInteractionTs: 0,
stops: [],
lastStopsFetchCoord: null,
lastStopsFetchTs: 0,
stopSel: null,
lines: [],
lineSel: null,
route: null,
buses: [],
followBusEnabled: true,
timer: null,
watchGpsId: null,
lastError: null,
searchQuery: "",
searchType: "ponto",
weather: null,
lastWeatherFetchCoord: null,
lastWeatherFetchTs: 0
};
let leafletMap = null;
let userMarker = null;
let stopMarkersGroup = null;
let busMarkersGroup = null;
let initialCenterSet = false;
const el = s => document.getElementById(s);
const screens = el("screens");
const ALLOWED_RADII = [600, 900, 1200];
let isPopping = false; // true enquanto um popstate (botão/gesto voltar) está sendo processado
function loadPersistedSettings(){
try{
const r = parseInt(localStorage.getItem("busbus_radar_radius"), 10);
if(ALLOWED_RADII.includes(r)) state.radarRadius = r;
}catch(e){}
try{
state.rotationEnabled = localStorage.getItem("busbus_rotation_enabled") === "1";
}catch(e){}
try{
const t = localStorage.getItem("busbus_theme");
if(t === "dark" || t === "amoled" || t === "light" || t === "system") state.theme = t;
}catch(e){}
try{
const mt = localStorage.getItem("busbus_map_theme");
if(mt === "light" || mt === "dark" || mt === "auto") state.mapTheme = mt;
}catch(e){}
try{
const favs = JSON.parse(localStorage.getItem("busbus_favorites") || "[]");
if(Array.isArray(favs)) state.favoriteStops = favs;
}catch(e){}
}
function applyTheme(theme){
if(theme === "dark" || theme === "amoled" || theme === "light"){
document.documentElement.setAttribute("data-theme", theme);
} else {
document.documentElement.removeAttribute("data-theme"); // "system": deixa o @media prefers-color-scheme decidir
}
}
function setTheme(theme){
state.theme = theme;
applyTheme(theme);
try{ localStorage.setItem("busbus_theme", theme); }catch(e){}
renderConfigScreen();
}
function setMapTheme(theme){
state.mapTheme = theme;
try{ localStorage.setItem("busbus_map_theme", theme); }catch(e){}
renderConfigScreen();
// Se o mapa da tela de paradas já estiver aberto, recarrega ele agora com
// o visual novo. Os outros mapas (linha em tempo real, planejar rota)
// pegam o tema atualizado da próxima vez que forem abertos — refazê-los na
// hora atrapalharia o acompanhamento do ônibus que já estiver rolando.
if(leafletMap && state.view === "stops"){
destroyLeafletMap();
try{ initLeafletMapOnce(); }catch(e){ console.error("[BusBus] mapa indisponível:", e); }
}
}
function effectiveMapIsDark(){
if(state.mapTheme === "dark") return true;
if(state.mapTheme === "light") return false;
// "auto": segue o tema do app (e, se o app estiver no padrão do sistema,
// segue o modo claro/escuro do próprio aparelho)
if(state.theme === "dark" || state.theme === "amoled") return true;
if(state.theme === "light") return false;
try{ return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches; }
catch(e){ return false; }
}
// A cor normal da polilinha (azul escuro) some quase por completo em cima
// do mapa escuro (que é o tile claro invertido por CSS, ver addBaseMapLayers
// — fica um fundo escuro navy). Por isso, no modo escuro do mapa a rota usa
// um azul bem mais claro, legível em cima do fundo escuro.
function routeLineColor(){
return effectiveMapIsDark() ? '#7EC8FF' : '#2B5F8A';
}
// Usado pelos três mapas do app (paradas, linha em tempo real e planejar
// rota). Tentei usar os tiles da CARTO (base sem texto + uma camada só com
// os rótulos das ruas por cima da rota, e um visual escuro de verdade) mas
// a CARTO passou a exigir uma chave de API própria pra isso — sem chave,
// os tiles vêm com uma marca d'água de "API KEY REQUIRED" por cima do mapa
// inteiro, pior que o problema original. Então aqui fica o tile padrão do
// OpenStreetMap (gratuito, sem chave, o mesmo de sempre), e o "modo escuro"
// do mapa é simulado invertendo as cores da camada de tiles por CSS — não é
// um tile desenhado pra ser escuro, mas evita tanto a marca d'água quanto
// depender de uma chave paga. Como o nome das ruas vem "pintado" dentro da
// própria imagem do tile (não dá pra separar sem um provedor pago), a rota
// agora é desenhada mais fina e translúcida, só pra incomodar menos a
// leitura do nome da rua por baixo — não é a sobreposição perfeita tipo
// Google Maps, que exigiria tiles vetoriais (pagos) pra funcionar de graça.
function addBaseMapLayers(map){
const dark = effectiveMapIsDark();
const layer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
maxZoom: 19
}).addTo(map);
const applyDarkFilter = () => {
const pane = map.getPane("tilePane");
if(pane) pane.style.filter = dark ? "invert(1) hue-rotate(180deg) brightness(0.95) contrast(0.9)" : "";
};
if(layer && typeof layer.on === "function") layer.on("load", applyDarkFilter);
applyDarkFilter();
}
function saveRotationEnabled(v){
state.rotationEnabled = v;
try{ localStorage.setItem("busbus_rotation_enabled", v ? "1" : "0"); }catch(e){}
}
function isFavorite(id){ return state.favoriteStops.some(f => String(f.id) === String(id)); }
function toggleFavorite(id, name, lat, lng){
if(isFavorite(id)){
state.favoriteStops = state.favoriteStops.filter(f => String(f.id) !== String(id));
} else {
state.favoriteStops.push({ id, name, lat, lng });
}
try{ localStorage.setItem("busbus_favorites", JSON.stringify(state.favoriteStops)); }catch(e){}
const btn = el("favBtn");
if(btn) btn.innerHTML = isFavorite(id) ? starIconFilled : starIconOutline;
}
function openFavoriteStop(id, lat, lng, name){
if(!state.stops.find(s => String(s.id) === String(id))) state.stops.push({ id, name, lat, lng });
focusStopOnMap(lat, lng);
selectStop(id);
}
// Pilha lógica das telas "de primeiro nível" (as abas: paradas, pesquisar,
// rota, ajustes, mensagens), uma posição por entrada real do histórico do
// navegador. Antes, cada troca de aba empilhava sempre uma entrada nova —
// então, numa sessão longa alternando entre as mesmas abas repetidas vezes,
// o histórico só crescia, sem limite, e "voltar" podia precisar de
// centenas/milhares de toques até chegar na primeira vez que a pessoa
// esteve na Home. Agora, se a aba pra onde você está indo já existe em
// algum ponto mais abaixo dessa pilha, a gente pula direto pra essa posição
// já existente (history.go) em vez de empilhar mais uma — o navegador
// descarta sozinho as entradas que ficaram "à frente" dela assim que uma
// navegação nova empilhar algo ali, então a pilha nunca cresce além do
// número de telas realmente diferentes visitadas na sequência atual.
let navStack = ["stops"];
function pushNav(label){
if(isPopping) return;
const existingIdx = navStack.indexOf(label);
if(existingIdx !== -1 && existingIdx < navStack.length - 1){
const delta = navStack.length - 1 - existingIdx;
navStack = navStack.slice(0, existingIdx + 1);
isPopping = true;
try{ history.go(-delta); }
catch(e){ console.error("[BusBus] history.go bloqueado:", e); isPopping = false; }
return;
}
if(existingIdx === -1){
navStack.push(label);
try{ history.pushState({ label }, "", "#" + label); }
catch(e){ console.error("[BusBus] pushState bloqueado:", e); navStack.pop(); }
}
// se existingIdx === navStack.length-1, a aba já é a atual (ex.: pushNav
// chamado de novo pra mesma tela) — nada a fazer no histórico.
}
function handlePopState(e){
stopPolling();
isPopping = true;
const label = (e.state && e.state.label) || "stops";
const stackIdx = navStack.indexOf(label);
navStack = stackIdx !== -1 ? navStack.slice(0, stackIdx + 1) : ["stops"];
if(label !== "route") destroyTripMap();
if(label === "lines" && state.stopSel){
destroyLeafletMap();
state.view = "lines";
updateHeaderAndNav("lines");
el("subtitle").textContent = state.stopSel.name;
renderLines();
if(savedLinesScrollY){
requestAnimationFrame(() => window.scrollTo(0, savedLinesScrollY));
}
} else if(label === "search"){
destroyLeafletMap();
pendingSearchScrollRestore = true;
renderSearchScreen();
} else if(label === "route"){
destroyLeafletMap(); renderRouteScreen();
} else if(label === "config"){
destroyLeafletMap(); renderConfigScreen();
} else if(label === "messages"){
destroyLeafletMap(); renderMessagesScreen();
} else {
renderStopsScreenStructure(); startGpsTracking();
}
isPopping = false;
}
window.addEventListener("popstate", handlePopState);
async function api(path){
const url = `${BASE}${path}`;
const res = await fetch(url);
if(!res.ok) throw new Error(`HTTP ${res.status}`);
return res.json();
}
function jsStr(s){ return JSON.stringify(String(s ?? "")).replace(/"/g, "&quot;"); }
function pick(obj, candidates, fallback=null){
for(const c of candidates){ if(obj && obj[c] !== undefined && obj[c] !== null) return obj[c]; }
return fallback;
}
function fmtEta(mins, schedTime){
if(mins !== null && mins !== undefined) {
if(mins <= 1) return { label: "chegando", cls: "now" };
if(mins <= 5) return { label: `${mins} min`, cls: "soon" };
return { label: `${mins} min`, cls: "" };
}
if(schedTime) return { label: schedTime, cls: "", isSched: true };
return { label: "—", cls: "" };
}
function fmtTimeAgo(ts){
if(!ts) return "";
const diffSec = Math.floor((Date.now() - ts) / 1000);
if(diffSec < 30) return "agora";
if(diffSec < 60) return "há menos de 1 min";
const mins = Math.floor(diffSec / 60);
if(mins < 60) return `há ${mins} min`;
const hrs = Math.floor(mins / 60);
return `há ${hrs} h`;
}
function render(html){ screens.innerHTML = html; }
function statusHTML(msg, loading, err){
if(!msg) return "";
return `<div class="status ${err?'err':''}">${loading?'<div class="spinner"></div>':''}${msg}</div>`;
}
function errMsg(e){ return e && e.message ? e.message : String(e); }
function destroyLeafletMap(){
if(leafletMap){
leafletMap.remove();
leafletMap = null;
userMarker = null;
stopMarkersGroup = null;
busMarkersGroup = null;
initialCenterSet = false;
}
}
function updateHeaderAndNav(viewName){
const backBtn = el("globalBackBtn");
const bottomNav = el("bottomNav");
const bellBtn = el("bellBtn");
if(viewName === "stops" || viewName === "search" || viewName === "config" || viewName === "route"){
bottomNav.classList.remove("hidden");
backBtn.classList.remove("show");
} else {
backBtn.classList.add("show");
bottomNav.classList.add("hidden");
}
if(bellBtn) bellBtn.classList.toggle("show", viewName === "stops");
document.querySelectorAll(".navBtn").forEach(btn => btn.classList.remove("active"));
if(viewName === 'search') el("btnNavSearch").classList.add("active");
if(viewName === 'stops' || viewName === 'lines' || viewName === 'map') el("btnNavHome").classList.add("active");
if(viewName === 'config') el("btnNavConfig").classList.add("active");
if(viewName === 'route') el("btnNavRoute").classList.add("active");
}
function goBack(){
try{ history.back(); }catch(e){ console.error("[BusBus] history.back bloqueado:", e); renderStopsScreenStructure(); startGpsTracking(); }
}
function navTo(tab){
if(tab === state.view){
// Já está nessa aba (tocada de novo à toa) — não há nada pra recarregar.
// Pra "paradas" isso também evita jogar fora o fix de GPS que já tínhamos
// e forçar esperar um novo, o que deixava a troca de aba lenta sem
// necessidade.
return;
}
stopPolling();
if(tab !== 'route') destroyTripMap();
if(tab === 'stops') {
renderStopsScreenStructure();
startGpsTracking();
} else if(tab === 'search') {
destroyLeafletMap();
renderSearchScreen();
} else if(tab === 'config') {
destroyLeafletMap();
renderConfigScreen();
} else if(tab === 'route') {
destroyLeafletMap();
renderRouteScreen();
} else if(tab === 'messages') {
destroyLeafletMap();
renderMessagesScreen();
}
pushNav(tab);
}
function startGpsTracking(){
// Se já existe um watch rodando, ele continua valendo — reiniciar aqui
// (clearWatch + watchPosition de novo) descartava o último fix de GPS e
// obrigava o aparelho a adquirir um fix 100% novo do zero (maximumAge: 0),
// o que podia levar vários segundos. Isso é o que deixava a troca de aba
// lenta: a cada navTo('stops') o app jogava fora uma localização boa que
// já tinha.
if(state.watchGpsId) return;
if("geolocation" in navigator){
state.watchGpsId = navigator.geolocation.watchPosition(
pos => {
setAndSaveCoord(pos.coords.latitude, pos.coords.longitude, "GPS Vivo");
},
err => {
fallbackToIpOrStorage();
},
{ enableHighAccuracy: true, timeout: 8000, maximumAge: 15000 }
);
} else {
fallbackToIpOrStorage();
}
}
function setAndSaveCoord(lat, lng, sourceName, timestamp = Date.now()){
state.coord = { lat, lng };
state.locSource = sourceName;
state.locTimestamp = timestamp;
try {
localStorage.setItem("busbus_last_coord", JSON.stringify({ lat, lng, sourceName, time: timestamp }));
} catch(e){}
if(state.view === "stops"){
updateMapUserPosition();
const now = Date.now();
const movedEnough = !state.lastStopsFetchCoord || metersBetween(state.lastStopsFetchCoord, state.coord) > 40;
const staleEnough = (now - state.lastStopsFetchTs) > 20000;
if(state.stops.length === 0 || movedEnough || staleEnough){
state.lastStopsFetchCoord = { lat, lng };
state.lastStopsFetchTs = now;
fetchStopsSilent();
}
const wMovedEnough = !state.lastWeatherFetchCoord || metersBetween(state.lastWeatherFetchCoord, state.coord) > 2000;
const wStaleEnough = (now - state.lastWeatherFetchTs) > 900000;
if(!state.weather || wMovedEnough || wStaleEnough){
state.lastWeatherFetchCoord = { lat, lng };
state.lastWeatherFetchTs = now;
fetchWeather(lat, lng);
}
}
}
function weatherEmoji(code){
if(code === 0) return "☀️";
if(code === 1 || code === 2) return "🌤️";
if(code === 3) return "☁️";
if(code === 45 || code === 48) return "🌫️";
if(code >= 51 && code <= 57) return "🌦️";
if(code >= 61 && code <= 67) return "🌧️";
if(code >= 71 && code <= 77) return "🌨️";
if(code >= 80 && code <= 82) return "🌧️";
if(code === 85 || code === 86) return "🌨️";
if(code >= 95) return "⛈️";
return "🌡️";
}
async function fetchWeather(lat, lng){
try{
const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=temperature_2m,apparent_temperature,weather_code,precipitation&timezone=auto`;
const res = await fetch(url);
if(!res.ok) return;
const data = await res.json();
const c = data && data.current;
if(!c) return;
state.weather = {
temp: Math.round(c.temperature_2m),
feels: Math.round(c.apparent_temperature),
code: c.weather_code,
precip: c.precipitation
};
renderWeatherChip();
}catch(e){ console.error("[BusBus] clima falhou:", e); }
}
function renderWeatherChip(){
const chip = el("weatherChip");
if(!chip || !state.weather) return;
const w = state.weather;
chip.innerHTML = `<span class="wIcon">${weatherEmoji(w.code)}</span>${w.temp}°<span class="wFeels">sensação ${w.feels}°</span>`;
chip.style.display = "flex";
}
function toggleWeatherDetail(){
let card = el("weatherDetailCard");
if(card){ card.remove(); return; }
if(!state.weather) return;
const w = state.weather;
const chip = el("weatherChip");
if(!chip) return;
const mapWrap = chip.closest(".mainMapContainer");
if(!mapWrap) return;
const div = document.createElement("div");
div.id = "weatherDetailCard";
div.className = "weatherDetailCard";
div.innerHTML = `<b>Previsão agora:</b> ${weatherEmoji(w.code)} ${w.temp}°C, sensação de ${w.feels}°C.`
+ (w.precip > 0 ? ` Chuva em curso (${w.precip}mm).` : " Sem chuva no momento.")
+ ` Bom saber se vale esperar o ônibus com guarda-chuva ou não.`;
mapWrap.insertAdjacentElement("afterend", div);
}
async function fallbackToIpOrStorage(){
try {
const saved = localStorage.getItem("busbus_last_coord");
if(saved){
const parsed = JSON.parse(saved);
if(parsed && parsed.lat && parsed.lng){
setAndSaveCoord(parsed.lat, parsed.lng, "Última Conhecida", parsed.time || Date.now() - 120000);
return;
}
}
} catch(e){}
try {
const res = await fetch("https://ipapi.co/json/");
const ipData = await res.json();
if(ipData && ipData.latitude && ipData.longitude){
setAndSaveCoord(ipData.latitude, ipData.longitude, "Aproximado (IP)");
return;
}
} catch(e){}
setAndSaveCoord(-1.4558, -48.4902, "Padrão Belém");
}
function renderStopsScreenStructure(){
state.view = "stops";
destroyLeafletMap();
updateHeaderAndNav("stops");
// O subtítulo de "Radar de Xm (fonte)" só era escrito dentro de
// fetchStopsSilent(), que só roda de novo quando a localização mudou o
// bastante ou ficou velha o bastante — então, ao voltar pra essa aba sem
// nenhuma dessas condições, o subtítulo continuava mostrando o texto da
// tela anterior (ex: "Ajustes do Radar"). Escreve aqui, na hora de montar a
// tela, pra sempre corresponder à tela que está de fato na tela.
const subtitleEl = el("subtitle");
if(subtitleEl){
subtitleEl.textContent = state.coord
? `Radar de ${state.radarRadius}m (${state.locSource})`
: "Buscando sua localização…";
}
render(`
<div class="mainMapContainer">
<div id="mapContainer"></div>
<div class="weatherChip" id="weatherChip" style="display:none;" onclick="toggleWeatherDetail()" title="Previsão do tempo"></div>
<div class="mapBtnStack">
<button class="mapBtn" id="locateBtn" onclick="recenterMap()" title="Ir para minha localização">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
</button>
${state.rotationEnabled ? `
<button class="mapBtn" id="compassBtn" onclick="resetOrientation()" title="Reorientar o mapa para o norte">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 L12 6 M9 4 L12 2 L15 4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="13" r="8"/><polygon points="12 9 14 13 12 17 10 13" fill="currentColor" stroke="none"/></svg>
</button>` : ""}
</div>
</div>
<div id="statusArea"></div>

function metersBetween(a, b){
const R = 6371000, latR = a.lat * Math.PI/180;
const dLat = (b.lat - a.lat) * Math.PI/180, dLng = (b.lng - a.lng) * Math.PI/180;
const x = dLng * Math.cos(latR), y = dLat;
return Math.sqrt(x*x + y*y) * R;
}
function getBusBearing(pts, lat, lng){
if(!pts || pts.length < 2) return 0;
let minDist = Infinity, closestIdx = 0;
for(let i=0; i<pts.length; i++){
const d = Math.hypot(pts[i].lat - lat, pts[i].lng - lng);
if(d < minDist){ minDist = d; closestIdx = i; }
}
const p1 = pts[closestIdx];
const MIN_METERS = 12;
let p2 = null;
for(let i = closestIdx + 1; i < pts.length; i++){
if(metersBetween(p1, pts[i]) >= MIN_METERS){ p2 = pts[i]; break; }
}
if(!p2){
for(let i = closestIdx - 1; i >= 0; i--){
if(metersBetween(p1, pts[i]) >= MIN_METERS){
const b = Math.atan2((p1.lng - pts[i].lng) * Math.cos(p1.lat*Math.PI/180), p1.lat - pts[i].lat) * (180/Math.PI);
return (b + 360) % 360;
}
}
return 0;
}
const bearing = Math.atan2((p2.lng - p1.lng) * Math.cos(p1.lat*Math.PI/180), p2.lat - p1.lat) * (180 / Math.PI);
return (bearing + 360) % 360;
}

return (s||"").toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
.replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim();
}

async function ensureAllLines(){
if(allLinesCache) return allLinesCache;
const data = await api(`/allLines/${CITY}`);
allLinesCache = (Array.isArray(data) ? data : []).map(l => ({
id: l.id, numero: l.numero || "", name: l.name || l.shortName || "Linha",
trajetos: (l.trajetos || []).map(t => ({
id: t.id_migracao, nome: t.nome || "", _id: t._id
}))
}));
return allLinesCache;
}
async function ensureAllPoints(){
if(allPointsCache) return allPointsCache;
const data = await api(`/allPoints/${CITY}`);
const list = Array.isArray(data) ? data : (data.items || data.result || []);
allPointsCache = list.map(p => ({
id: pick(p, ["id","pointId","idPonto","pointLocationId"]),
name: pick(p, ["name","nome","nomePonto","description"], "Parada sem nome"),
lat: pick(p, ["lat","latitude"]) ?? (p.latLng && p.latLng.lat),
lng: pick(p, ["lng","lon","longitude"]) ?? (p.latLng && p.latLng.lng)
})).filter(p => p.id !== null && p.lat && p.lng);
return allPointsCache;
}

let searchDebounce = null;
// Guarda onde a pessoa estava rolada na lista de resultados antes de tocar
// num ponto/linha, pra voltar pro mesmo lugar (e não pro topo) ao apertar
// "voltar" — igual já acontecia na lista de linhas de uma parada.
let savedSearchScrollY = 0;
let pendingSearchScrollRestore = false;
function restoreSearchScrollIfPending(){
if(!pendingSearchScrollRestore) return;
pendingSearchScrollRestore = false;
requestAnimationFrame(() => window.scrollTo(0, savedSearchScrollY));
}
// Se a pessoa digitar algo na pesquisa e não mexer mais na tela por um
// tempo, o campo se apaga sozinho — evita deixar uma busca antiga parada
// ali indefinidamente.
let searchIdleTimer = null;
const SEARCH_IDLE_CLEAR_MS = 90000;
function resetSearchIdleTimer(){
clearTimeout(searchIdleTimer);
if(!state.searchQuery) return;
searchIdleTimer = setTimeout(() => {
state.searchQuery = "";
const input = el("searchInput");
if(input) input.value = "";
toggleSearchClearBtn();
const resEl = el("searchResults");
if(resEl) resEl.innerHTML = renderSearchHistoryHTML(state.searchType);
}, SEARCH_IDLE_CLEAR_MS);
}
function handleSearch(q){
state.searchQuery = q;
toggleSearchClearBtn();
resetSearchIdleTimer();
clearTimeout(searchDebounce);
const resEl = el("searchResults");
if(!q.trim()){
resEl.innerHTML = renderSearchHistoryHTML(state.searchType);
restoreSearchScrollIfPending();
return;
}
resEl.innerHTML = statusHTML("Buscando…", true);
searchDebounce = setTimeout(async () => {
try{
if(state.searchType === "ponto") await runStopSearch(q, resEl);
else await runLineSearch(q, resEl);
restoreSearchScrollIfPending();
}catch(e){
resEl.innerHTML = `<div class="status err">Erro na busca: ${e.message}</div>`;
}
}, 250);
}
async function runStopSearch(q, resEl){
const points = await ensureAllPoints();
const nq = normalize(q);
const matches = points.filter(p => normalize(p.name).includes(nq)).slice(0, 40);
resEl.innerHTML = matches.length ? matches.map(p => `
<div class="stopCard" onclick="searchSelectStop(${p.id}, ${p.lat}, ${p.lng}, '${p.name.replace(/'/g,"\\'")}')">
<div class="stopIcon">${pinIcon}</div>
<div class="stopInfo"><div class="name">${p.name}</div><div class="meta">toque para ver as linhas</div></div>
</div>`).join("") : `<div class="empty">Nenhuma parada com esse nome.</div>`;
}
async function runLineSearch(q, resEl){
const lines = await ensureAllLines();
const nq = normalize(q);
const matches = lines.filter(l => normalize(l.numero).includes(nq) || normalize(l.name).includes(nq)).slice(0, 40);
resEl.innerHTML = matches.length ? matches.map(l => `
<div class="lineRow" onclick="searchSelectLine(${l.id})">
<div class="badge">${l.numero || "—"}</div>
<div class="dest">${l.name}</div>
${l.trajetos[0] ? `<button class="infoBtn" onclick="event.stopPropagation();showRouteStreetsModal(${l.id}, ${l.trajetos[0].id})" title="Ver ruas desta linha">i</button>` : ""}
</div>`).join("") : `<div class="empty">Nenhuma linha encontrada.</div>`;
}

async function searchSelectLine(lineId){
savedSearchScrollY = window.scrollY;
addSearchHistory("linha", state.searchQuery);
destroyLeafletMap();
state.view = "map";
updateHeaderAndNav("map");
el("subtitle").textContent = "Carregando a linha…";
render(statusHTML("Carregando rota e paradas…", true));
try{
const lines = await ensureAllLines();
const line = lines.find(l => String(l.id) === String(lineId));
if(!line || !line.trajetos.length) throw new Error("linha sem trajeto cadastrado");
const trajeto = line.trajetos[0];
const pat = await api(`/pattern/${line.id}/${CITY}`);
const seg = (Array.isArray(pat) ? pat : []).find(p => String(p.id) === String(trajeto.id)) || pat[0];
const route = seg ? seg.polyLine : [];
if(!route.length) throw new Error("sem geometria de rota");
const points = await ensureAllPoints();
const origin = route[0];
let nearest = null, best = Infinity;
for(const p of points){
const d = metersBetween(origin, p);
if(d < best){ best = d; nearest = p; }
}
if(!nearest) throw new Error("não achei uma parada próxima da rota");
if(!state.stops.find(s => String(s.id) === String(nearest.id))) state.stops.push(nearest);
state.stopSel = nearest;
state.lineSel = { busServiceId: line.id, patternId: trajeto.id, name: `${line.numero} - ${line.name}`, dest: trajeto.nome };
state.route = route;
state.followBusEnabled = true;
el("subtitle").textContent = `${line.numero} · perto de ${nearest.name}`;
render(`<div class="mainMapContainer" style="height:280px;"><div id="mapContainer"></div><div class="mapBtnStack">${followBtnHTML()}</div></div><section id="busListSection"></section>`);
initLineRouteMap();
await refreshBusesOnMap();
startPolling();
pushNav("map");
}catch(e){
render(`${statusHTML("Não consegui carregar essa linha: "+e.message, false, true)}`);
}
}

function bearingBetween(a, b){
return Math.atan2((b.lng - a.lng) * Math.cos(a.lat*Math.PI/180), b.lat - a.lat) * (180/Math.PI);
}
function decimateRouteForGeocoding(route, maxPoints = 22){
if(!route || route.length < 2) return [];
const pts = [route[0]];
let lastSample = route[0], lastBearing = null, distSinceLast = 0;
for(let i = 1; i < route.length; i++){
const d = metersBetween(lastSample, route[i]);
if(d < 3) continue; // ignora ruído de GPS parado
distSinceLast += d;
const bearing = bearingBetween(lastSample, route[i]);
const turned = lastBearing !== null && Math.min(Math.abs(bearing - lastBearing), 360 - Math.abs(bearing - lastBearing)) > 28;
if((turned && distSinceLast > 40) || distSinceLast > 550){
pts.push(route[i]);
lastSample = route[i]; lastBearing = bearing; distSinceLast = 0;
} else {
lastBearing = bearing;
}
}
const last = route[route.length - 1];
if(metersBetween(pts[pts.length-1], last) > 30) pts.push(last);
if(pts.length > maxPoints){
const step = pts.length / maxPoints;
const sampled = [];
for(let i = 0; i < maxPoints; i++) sampled.push(pts[Math.floor(i*step)]);
sampled.push(pts[pts.length-1]);
return sampled;
}
return pts;
}
async function nominatimReverse(lat, lng){
try{
const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&zoom=17&addressdetails=1`);
if(!res.ok) return null;
const data = await res.json();
const a = data.address || {};
return a.road || a.pedestrian || a.footway || a.square || data.name || null;
}catch(e){ return null; }
}
async function showRouteStreetsModal(busServiceId, patternId, preloadedRoute){
openModal(`
<div class="modalHead"><h3>Ruas da linha</h3><button class="modalClose" onclick="closeModal()">✕</button></div>
<div id="streetsModalBody">${statusHTML("Carregando a geometria da rota…", true)}</div>
`);
try{
let route = preloadedRoute;
if(!route || !route.length){
const pat = await api(`/pattern/${busServiceId}/${CITY}`);
const seg = (Array.isArray(pat) ? pat : []).find(p => String(p.id) === String(patternId)) || pat[0];
route = seg ? seg.polyLine : [];
}
if(!route || route.length < 2){
el("streetsModalBody").innerHTML = `<div class="empty">Sem geometria de rota pra essa linha.</div>`;
return;
}
const samples = decimateRouteForGeocoding(route);
const names = [];
for(let i = 0; i < samples.length; i++){
const body = el("streetsModalBody");
if(!body) return; // modal foi fechado no meio do processo
body.innerHTML = `${statusHTML(`Identificando ruas… (${i+1} de ${samples.length})`, true)}` +
(names.length ? renderStreetsList(dedupeConsecutive(names)) : "");
const name = await nominatimReverse(samples[i].lat, samples[i].lng);
if(name) names.push(name);
await new Promise(r => setTimeout(r, 1100)); // respeita o limite de 1 req/s do Nominatim
}
const finalBody = el("streetsModalBody");
if(!finalBody) return;
const uniqueNames = dedupeConsecutive(names);
finalBody.innerHTML = uniqueNames.length
? renderStreetsList(uniqueNames)
: `<div class="empty">Não consegui identificar as ruas (tente de novo).</div>`;
}catch(e){
const body = el("streetsModalBody");
if(body) body.innerHTML = `<div class="status err">Erro: ${e.message}</div>`;
}
}
function dedupeConsecutive(arr){
return arr.filter((name, i) => name !== arr[i-1]);
}
function renderStreetsList(names){
return names.map((n,i) => `<div class="streetItem"><div class="n">${i+1}</div>${n}</div>`).join("");
}

async function getPatternSegments(busServiceId){
if(patternCache[busServiceId]) return patternCache[busServiceId];
try{
const pat = await api(`/pattern/${busServiceId}/${CITY}`);
const segs = Array.isArray(pat) ? pat : [];
patternCache[busServiceId] = segs;
return segs;
}catch(e){ return []; }
}
function getRouteForPattern(segs, patternId){
const seg = segs.find(p => String(p.id) === String(patternId)) || segs[0];
return seg ? (seg.polyLine || []) : [];
}
function closestDistanceToPoint(route, target){
if(!route || !route.length) return { dist: Infinity, point: null };
let minD = Infinity, minP = null;
const step = Math.max(1, Math.floor(route.length / 900));
for(let i = 0; i < route.length; i += step){
const d = metersBetween(route[i], target);
if(d < minD){ minD = d; minP = route[i]; }
}
return { dist: minD, point: minP };
}
function nearestRealStop(point, points, maxD = 250){
let best = null, bestD = Infinity;
for(const p of points){ const d = metersBetween(point, p); if(d < bestD){ bestD = d; best = p; } }
return best ? { ...best, d: bestD, withinRange: bestD <= maxD } : null;
}

const list = Array.isArray(data) ? data : (data.items || data.result || []);
return list.map(l => ({
busServiceId: pick(l, ["busServiceId","idLinha","lineId"]),
patternId: pick(l, ["patternId","idPadrao","patternID"]),
numero: pick(l, ["busServiceNumber","numero","number"], "—"),
name: pick(l, ["nameLine","name","nome"], "Linha"),
dest: pick(l, ["destination","destino"], "")
})).filter(l => l.busServiceId && l.patternId);
}catch(e){ return []; }
}
async function fetchScheduledLinesAtStop(stopId){
try{
const data = await api(`/linesFromBusstop/${stopId}/${CITY}`);
const list = Array.isArray(data) ? data : [];
const out = [];
list.forEach(l => {
(l.trajetos || []).forEach(t => {
if(l.id && t.id_migracao){
out.push({
busServiceId: l.id, patternId: t.id_migracao,
numero: l.numero || "—", name: l.name || l.shortName || "Linha", dest: t.nome || ""
});
}
});
});
return out;
}catch(e){ return []; }
}
const WALK_OK = 700; // metros — "perto o bastante pra caminhar" até uma parada ou até o destino final

async function planTrip(){
planTrace = [];
const area = el("tripResultsArea");
area.innerHTML = statusHTML("Buscando paradas perto de você…", true);
try{
const points = await ensureAllPoints();
trace(`allPoints retornou ${points.length} parada(s) com id+lat/lng reconhecidos no total da cidade.`);
const nearOrigin = points.map(p => ({ ...p, d: metersBetween(tripOrigin, p) }))
.sort((a,b) => a.d - b.d).slice(0, 6);
trace(`6 paradas mais próximas da origem: ${nearOrigin.map(s => `${s.name} (${Math.round(s.d)}m)`).join(", ") || "nenhuma"}.`);
area.innerHTML = statusHTML(`Verificando linhas em ${nearOrigin.length} parada(s) próxima(s)…`, true);
const linesByStop = await Promise.all(nearOrigin.map(s => fetchScheduledLinesAtStop(s.id)));
nearOrigin.forEach((s,i) => {
trace(`Parada "${s.name}": linesFromBusstop devolveu ${linesByStop[i].length} linha(s)${linesByStop[i].length ? " (" + linesByStop[i].map(l=>l.numero).join(", ") + ")" : ""}.`);
});
trace(`Usando linesFromBusstop (grade programada), não o fromPoint em tempo real — então a linha aparece aqui mesmo sem ônibus ativo rastreado agora.`);
const candidates = new Map();
nearOrigin.forEach((stop, i) => {
linesByStop[i].forEach(l => {
const key = l.patternId;
const existing = candidates.get(key);
if(!existing || stop.d < existing.boardStop.d){
candidates.set(key, { boardStop: stop, line: l });
}
});
});
const candList = Array.from(candidates.values()).slice(0, 14);
trace(`${candList.length} linha(s) candidata(s) únicas no total (deduplicadas por patternId).`);
if(!candList.length){
area.innerHTML = `<div class="empty">Nenhuma linha com ônibus ativo agora passa perto de onde você está (raio: 6 paradas mais próximas). Tente de novo mais tarde, ou ajuste a origem.</div>${renderDiagnosticBlock()}`;
return;
}
area.innerHTML = statusHTML(`Verificando ${candList.length} linha(s) candidata(s)…`, true);
const directResults = [];
for(const c of candList){
const segs = await getPatternSegments(c.line.busServiceId);
const route = getRouteForPattern(segs, c.line.patternId);
if(route.length < 2){ trace(`Linha ${c.line.numero}: sem geometria de rota retornada pelo /pattern — pulada.`); continue; }
const { dist, point } = closestDistanceToPoint(route, tripDestination);
trace(`Linha ${c.line.numero} (embarque: ${c.boardStop.name}): ponto mais próximo do destino na rota fica a ${Math.round(dist)}m ${dist <= WALK_OK ? "✅ direto" : "— longe demais a pé"}.`);
if(dist <= WALK_OK){
const alightStop = nearestRealStop(point, points, 300);
directResults.push({ type: "direct", boardStop: c.boardStop, line: c.line, walkFrom: dist, alightStop });
}
}
directResults.sort((a,b) => (a.boardStop.d + a.walkFrom) - (b.boardStop.d + b.walkFrom));
if(directResults.length){
renderTripResults(directResults.slice(0, 4));
return;
}
trace(`Nenhuma linha direta chegou perto o bastante do destino. Procurando baldeação…`);
area.innerHTML = statusHTML("Sem linha direta — procurando conexões com baldeação…", true);
const transferStopsToTry = [];
for(const c of candList.slice(0, 6)){
const segs = await getPatternSegments(c.line.busServiceId);
const route = getRouteForPattern(segs, c.line.patternId);
if(route.length < 2) continue;
let lastSample = route[0], found = 0;
for(let i = 1; i < route.length && found < 3; i++){
if(metersBetween(lastSample, route[i]) < 450) continue;
lastSample = route[i];
const near = nearestRealStop(route[i], points, 180);
if(near && near.id !== c.boardStop.id){
transferStopsToTry.push({ leg1: c, transferStop: near });
found++;
}
}
if(transferStopsToTry.length >= 9) break;
}
trace(`${transferStopsToTry.length} possível(is) parada(s) de baldeação encontrada(s) ao longo das rotas candidatas.`);
const transferResults = [];
for(const t of transferStopsToTry.slice(0, 9)){
const legBLines = await fetchScheduledLinesAtStop(t.transferStop.id);
trace(`Baldeação em "${t.transferStop.name}" (linha ${t.leg1.line.numero}): linesFromBusstop achou ${legBLines.length} linha(s) ali.`);
for(const lb of legBLines){
if(lb.patternId === t.leg1.line.patternId) continue; // mesma linha, não é baldeação de verdade
const segs = await getPatternSegments(lb.busServiceId);
const route = getRouteForPattern(segs, lb.patternId);
if(route.length < 2) continue;
const { dist, point } = closestDistanceToPoint(route, tripDestination);
trace(`  ↳ Linha ${lb.numero} a partir daí: ${Math.round(dist)}m do destino ${dist <= WALK_OK ? "✅" : "— longe demais"}.`);
if(dist <= WALK_OK){
const alightStop = nearestRealStop(point, points, 300);
transferResults.push({
type: "transfer", boardStop: t.leg1.boardStop, line: t.leg1.line,
transferStop: t.transferStop, line2: lb, walkFrom: dist, alightStop
});
break; // já achou uma conexão boa a partir dessa parada de baldeação, não precisa testar mais linhas daqui
}
}
if(transferResults.length >= 4) break;
}
transferResults.sort((a,b) => (a.boardStop.d + a.walkFrom) - (b.boardStop.d + b.walkFrom));
if(transferResults.length){
renderTripResults(transferResults.slice(0, 3));
} else {
area.innerHTML = `<div class="empty">Não encontrei uma rota direta nem com 1 baldeação. Tente uma origem ou destino um pouco diferente, ou use a busca por parada/linha manualmente.</div>${renderDiagnosticBlock()}`;
}
}catch(e){
trace(`Erro não esperado: ${e.message}`);
area.innerHTML = `<div class="status err">Erro ao traçar a rota: ${e.message}</div>${renderDiagnosticBlock()}`;
}
}

function copyPixCode(){
const btn = el("pixCopyBtn");
const done = () => { if(!btn) return; const old = btn.textContent; btn.textContent = "Copiado!"; setTimeout(() => { btn.textContent = old; }, 1800); };
const legacy = () => { try{ const ta = document.createElement("textarea"); ta.value = PIX_CODE; ta.style.cssText = "position:fixed;opacity:0"; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); done(); }catch(e){ console.error("[BusBus] copiar Pix falhou:", e); } };
try{ if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(PIX_CODE).then(done).catch(legacy); } else { legacy(); } }catch(e){ legacy(); }
}

uma crítica a uma empresa ou pessoa específica: é uma crítica construtiva, feita na esperança de que os sistemas
